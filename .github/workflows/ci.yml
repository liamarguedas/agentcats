name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The published package, installed with plain npm in an empty folder and run
  # with --demo: what a stranger gets from `npx agentcats --demo`.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @agentcats/ui build
      - run: pnpm -F agentcats pack:build
      # What npm would change when publishing, it changes silently (it once
      # dropped the bin): fail instead. Pinned to the npm the release uses.
      - name: Publish dry run, with nothing for npm to correct
        shell: bash
        run: |
          npx -y npm@11.20.0 publish --dry-run packages/cli/pack 2>&1 | tee "$RUNNER_TEMP/publish.log"
          if grep -q "auto-corrected" "$RUNNER_TEMP/publish.log"; then exit 1; fi
      - name: Install the packed package in an empty folder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          (cd packages/cli/pack && npm pack --pack-destination "$RUNNER_TEMP/try")
          cd "$RUNNER_TEMP/try" && npm init -y > /dev/null && npm install ./agentcats-*.tgz
      - run: node packages/cli/scripts/smoke.mjs "${{ runner.temp }}/try"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @agentcats/ui exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: packages/ui/test-results/
          if-no-files-found: ignore
